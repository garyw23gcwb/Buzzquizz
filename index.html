<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BUZZ! Family Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #fbbf24; --gold-dark: #b45309; --blue: #2563eb; --red: #dc2626;
    --green: #059669; --orange: #d97706; --purple: #7c3aed;
    --bg: #0f172a; --card: #1e293b; --card2: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --dark: #0f172a; --ff: 'Fredoka', sans-serif; --fn: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--fn); background: linear-gradient(145deg, #0f172a 0%, #1a1040 50%, #0f172a 100%); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; flex-direction: column; }
  .screen.active { display: flex; }
  .card { background: var(--card); border-radius: 22px; padding: 32px 24px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.45); position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--purple), var(--blue)); }
  .logo { font-family: var(--ff); font-size: 68px; font-weight: 700; color: var(--gold); text-shadow: 0 0 40px rgba(251,191,36,0.3), 0 4px 0 var(--gold-dark); letter-spacing: 4px; margin-bottom: 4px; }
  .logo-sm { font-size: 42px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .btn { font-family: var(--ff); font-weight: 700; border: none; border-radius: 14px; padding: 16px 32px; font-size: 17px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; width: 100%; margin-bottom: 10px; }
  .btn:active { transform: scale(0.97); }
  .btn-master { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; box-shadow: 0 4px 18px rgba(124,58,237,0.35); }
  .btn-player { background: linear-gradient(135deg, #2563eb, #0891b2); color: #fff; box-shadow: 0 4px 18px rgba(37,99,235,0.35); }
  .btn-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; box-shadow: 0 4px 18px rgba(251,191,36,0.25); }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-danger { background: #dc2626; color: #fff; font-size: 13px; padding: 10px 20px; }
  input[type="text"] { width: 100%; padding: 14px 16px; font-size: 17px; border-radius: 12px; border: 2px solid var(--card2); background: var(--dark); color: var(--text); outline: none; font-family: var(--fn); margin-bottom: 14px; }
  input[type="text"]:focus { border-color: var(--blue); }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .emoji-btn { width: 42px; height: 42px; border-radius: 10px; border: 2px solid transparent; background: var(--dark); font-size: 20px; cursor: pointer; transition: all 0.2s; }
  .emoji-btn.sel { background: var(--blue); border-color: var(--blue); transform: scale(1.15); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 36px; }
  .chip { background: var(--card2); color: var(--text); padding: 7px 14px; border-radius: 18px; font-size: 14px; font-weight: 600; animation: popIn 0.3s ease; }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .badge { background: var(--card2); color: #60a5fa; padding: 4px 11px; border-radius: 7px; font-size: 12px; font-weight: 600; }
  .timer-ring { width: 54px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; background: var(--dark); border: 3px solid var(--card2); flex-shrink: 0; }
  .timer-num { font-family: var(--ff); font-size: 23px; font-weight: 700; }
  .timer-green { color: #22c55e; }
  .timer-yellow { color: #fbbf24; }
  .timer-red { color: #ef4444; }
  .q-text { font-family: var(--ff); color: #f1f5f9; font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; text-align: left; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .opt { padding: 14px 14px; border-radius: 13px; display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 500; font-size: 14px; border: 3px solid transparent; transition: all 0.3s; }
  .opt-a { background: var(--blue); } .opt-b { background: var(--red); }
  .opt-c { background: var(--green); } .opt-d { background: var(--orange); }
  .opt.correct { background: #16a34a !important; border-color: #4ade80 !important; opacity: 1 !important; }
  .opt.wrong { background: var(--card2) !important; opacity: 0.4 !important; }
  .opt-letter { font-size: 17px; font-weight: 700; opacity: 0.6; min-width: 24px; }
  .progress-bar { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .progress-track { flex: 1; height: 7px; background: var(--card2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), #60a5fa); border-radius: 4px; transition: width 0.4s; }
  .scoreboard { background: var(--dark); border-radius: 10px; padding: 12px 14px; margin-top: 16px; }
  .score-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
  .score-pos { min-width: 20px; font-weight: 700; }
  .score-name { flex: 1; }
  .score-pts { color: var(--gold); font-weight: 600; }
  .final-row { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-radius: 11px; margin-bottom: 6px; }
  .final-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); transform: scale(1.03); }
  .final-2 { background: linear-gradient(135deg, #94a3b8, #64748b); }
  .final-3 { background: linear-gradient(135deg, #d97706, #b45309); }
  .final-other { background: var(--card); }
  .player-opts { display: flex; flex-direction: column; gap: 8px; }
  .player-opt { display: flex; align-items: center; gap: 10px; padding: 15px 16px; border-radius: 12px; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer; border: 3px solid transparent; font-family: var(--fn); transition: all 0.2s; text-align: left; }
  .player-opt:disabled { cursor: default; }
  .player-opt.selected { border-color: #fff; }
  .player-opt.p-correct { background: #16a34a !important; border-color: #4ade80 !important; }
  .player-opt.p-wrong-mine { background: #dc2626 !important; border-color: #f87171 !important; }
  .player-opt.p-dim { opacity: 0.35 !important; }
  .status-bar { margin-top: 14px; padding: 10px 16px; border-radius: 10px; text-align: center; font-size: 15px; font-weight: 600; }
  .status-locked { background: #172554; color: #60a5fa; }
  .status-correct { background: #052e16; color: #4ade80; }
  .status-wrong { background: #450a0a; color: #f87171; }
  .status-timeout { background: var(--card); color: var(--muted); }
  .room-code { font-family: var(--ff); font-size: 36px; letter-spacing: 6px; color: var(--gold); background: var(--dark); padding: 12px 24px; border-radius: 12px; display: inline-block; margin: 12px 0; }
  .flex-row { display: flex; gap: 10px; }
  .flex-row .btn { flex: 1; }
  @media (max-width: 500px) {
    .opts-grid { grid-template-columns: 1fr; }
    .q-text { font-size: 17px; }
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>

<!-- ROLE SELECT -->

<div id="screen-role" class="screen active">
  <div class="card">
    <div class="logo">BUZZ!</div>

    <div class="flex-row" id="m-controls"></div>
    <div class="scoreboard" id="m-scoreboard"></div>
  </div>
</div>

<!-- MASTER ROUND END -->

<div id="screen-master-roundend" class="screen">

    <h2 style="color:var(--gold);font-family:var(--ff);margin-bottom:4px" id="roundend-title"></h2>

    <div id="roundend-scores"></div>
    <p style="color:#64748b;margin:16px 0 12px" id="roundend-next"></p>
    <button class="btn btn-gold" id="roundend-btn" onclick="masterNextRound()"></button>
  </div>
</div>

<!-- MASTER FINISHED -->

<div id="screen-master-finished" class="screen">
  <div class="card">
    <div style="font-size:48px;margin-bottom:8px">🏆</div>
    <h2 style="color:var(--text);font-family:var(--ff);margin-bottom:16px">Game Over!</h2>
    <div id="final-scores"></div>
    <button class="btn btn-gold" style="margin-top:16px" onclick="masterReset()">New Game</button>
  </div>
</div>

<!-- PLAYER JOIN -->

<div id="screen-player-join" class="screen">
  <div class="card">
    <div class="logo logo-sm">BUZZ!</div>
    <p class="subtitle">Join a game</p>
    <input type="text" id="room-input" placeholder="Room code" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:4px;text-transform:uppercase">
    <input type="text" id="name-input" placeholder="Your name" maxlength="16">
    <div class="emoji-grid" id="emoji-grid"></div>
    <button class="btn btn-player" onclick="playerJoin()">Join Game</button>
  </div>
</div>

<!-- PLAYER WAITING -->

<div id="screen-player-wait" class="screen">
  <div class="card">
    <div style="font-size:52px;margin-bottom:12px" class="pulse" id="pw-emoji"></div>
    <h2 style="font-family:var(--ff);margin-bottom:8px" id="pw-name"></h2>
    <p style="color:var(--muted)">Waiting for the Quiz Master to start...</p>
  </div>
</div>

<!-- PLAYER GAME -->

<div id="screen-player-game" class="screen">
  <div class="card" style="max-width:420px;text-align:left">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="badge" id="p-round-badge"></span>
      <span style="color:var(--gold);font-weight:700" id="p-score">0 pts</span>
    </div>
    <p class="q-text" style="font-size:17px" id="p-question"></p>
    <div class="player-opts" id="p-options"></div>
    <div id="p-status"></div>
  </div>
</div>

<!-- PLAYER FINISHED -->

<div id="screen-player-finished" class="screen">
  <div class="card">
    <div style="font-size:48px;margin-bottom:8px" id="pf-trophy"></div>
    <h2 style="font-family:var(--ff);margin-bottom:4px" id="pf-title"></h2>
    <p style="color:var(--gold);font-size:26px;font-weight:700;margin:4px 0 16px" id="pf-score"></p>
    <div id="pf-board"></div>
  </div>
</div>

<!-- PLAYER ROUND END -->

<div id="screen-player-roundend" class="screen">
  <div class="card">
    <h2 style="color:var(--gold);font-family:var(--ff);margin-bottom:8px">Round Complete!</h2>
    <p style="color:var(--muted);margin-bottom:12px">Next round starting soon...</p>
    <p style="color:var(--text);font-size:22px;font-weight:700" id="pr-score"></p>
  </div>
</div>

const LETTERS = ["A","B","C","D"];
const OPT_CLASSES = ["opt-a","opt-b","opt-c","opt-d"];
const PLAYER_BG = ["var(--blue)","var(--red)","var(--green)","var(--orange)"];
const TIME_LIMIT = 15;
const PTS_CORRECT = 1000;
const PTS_SPEED_MAX = 500;
const EMOJIS = ["🎮","🎯","🚀","⚡","🔥","🌟","💎","🎸","🐉","🦄"];

let role = null;
let roomCode = "";
let playerName = "";
let playerEmoji = "🎮";
let timerInterval = null;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function roomRef(path) { return ref(db, `rooms/${roomCode}/${path}`); }

function sorted(scores) {
  return Object.entries(scores || {}).sort((a, b) => b[1] - a[1]);
}

// ── ROLE SELECT ──────────────────────────────────────────────────────────────
window.showMasterSetup = function() {
  role = "master";
  roomCode = genRoomCode();
  document.getElementById("room-code-display").textContent = roomCode;
  showScreen("screen-master-lobby");

  // Init room
  set(roomRef(""), {
    state: "lobby",
    qIndex: 0,
    questionStartTime: 0,
    players: {},
    answers: {},
    scores: {}
  });

  // Listen for players
  onValue(roomRef("players"), snap => {
    const players = snap.val() || {};
    const container = document.getElementById("lobby-players");
    container.innerHTML = "";
    Object.entries(players).forEach(([name, data]) => {
      const d = document.createElement("div");
      d.className = "chip";
      d.textContent = `${data.emoji || "🎮"} ${name}`;
      container.appendChild(d);
    });
    const btn = document.getElementById("start-game-btn");
    btn.style.display = Object.keys(players).length >= 1 ? "block" : "none";
    btn.textContent = `Start Game (${Object.keys(players).length} player${Object.keys(players).length !== 1 ? "s" : ""})`;
  });
};

window.showPlayerJoin = function() {
  role = "player";
  showScreen("screen-player-join");
  const grid = document.getElementById("emoji-grid");
  grid.innerHTML = "";
  EMOJIS.forEach(e => {
    const b = document.createElement("button");
    b.className = "emoji-btn" + (e === playerEmoji ? " sel" : "");
    b.textContent = e;
    b.onclick = () => {
      playerEmoji = e;
      grid.querySelectorAll(".emoji-btn").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
    };
    grid.appendChild(b);
  });
};

// ── PLAYER JOIN ──────────────────────────────────────────────────────────────
window.playerJoin = async function() {
  const code = document.getElementById("room-input").value.trim().toUpperCase();
  const name = document.getElementById("name-input").value.trim();
  if (!code || !name) return;

  roomCode = code;
  playerName = name;

  // Check room exists
  const snap = await get(roomRef("state"));
  if (!snap.exists()) { alert("Room not found. Check the code and try again."); return; }

  await set(roomRef(`players/${playerName}`), { emoji: playerEmoji, joinedAt: Date.now() });

  document.getElementById("pw-emoji").textContent = playerEmoji;
  document.getElementById("pw-name").textContent = `You're in, ${playerName}!`;
  showScreen("screen-player-wait");

  // Listen for game state
  let prevQi = -1;
  let myChoice = null;
  let locked = false;

  onValue(roomRef(""), snap => {
    const room = snap.val();
    if (!room) return;

    const state = room.state;
    const qi = room.qIndex || 0;
    const q = QUESTIONS[qi];
    const scores = room.scores || {};
    const myScore = scores[playerName] || 0;

    if (state === "lobby") { showScreen("screen-player-wait"); return; }

    if (state === "playing") {
      if (qi !== prevQi) { myChoice = null; locked = false; prevQi = qi; }
      showScreen("screen-player-game");
      document.getElementById("p-round-badge").textContent = `R${q.r}`;
      document.getElementById("p-score").textContent = `${myScore.toLocaleString()} pts`;
      document.getElementById("p-question").textContent = q.q;

      const opts = document.getElementById("p-options");
      opts.innerHTML = "";
      q.o.forEach((o, i) => {
        const btn = document.createElement("button");
        btn.className = `player-opt`;
        btn.style.background = PLAYER_BG[i];
        if (myChoice === i) btn.classList.add("selected");
        if (locked) btn.disabled = true;
        btn.innerHTML = `<span style="font-weight:700;opacity:0.6;min-width:22px">${LETTERS[i]}</span><span style="flex:1">${o}</span>`;
        btn.onclick = async () => {
          if (locked) return;
          myChoice = i; locked = true;
          await set(roomRef(`answers/${playerName}`), { qIndex: qi, choice: i, timestamp: Date.now(), questionStart: room.questionStartTime });
          // Re-render
          opts.querySelectorAll(".player-opt").forEach((b, j) => {
            if (j === i) b.classList.add("selected");
            b.disabled = true;
          });
          document.getElementById("p-status").innerHTML = `<div class="status-bar status-locked">🔒 Locked in!</div>`;
        };
        opts.appendChild(btn);
      });

      document.getElementById("p-status").innerHTML = locked ? `<div class="status-bar status-locked">🔒 Locked in!</div>` : "";
      return;
    }

    if (state === "revealing") {
      showScreen("screen-player-game");
      document.getElementById("p-round-badge").textContent = `R${q.r}`;
      document.getElementById("p-score").textContent = `${myScore.toLocaleString()} pts`;
      document.getElementById("p-question").textContent = q.q;

      const opts = document.getElementById("p-options");
      opts.innerHTML = "";
      q.o.forEach((o, i) => {
        const btn = document.createElement("button");
        btn.className = "player-opt";
        btn.disabled = true;
        btn.style.background = PLAYER_BG[i];
        const isCorrect = i === q.a;
        const isMine = myChoice === i;
        if (isCorrect) { btn.classList.add("p-correct"); btn.style.background = "#16a34a"; }
        else if (isMine) { btn.classList.add("p-wrong-mine"); btn.style.background = "#dc2626"; }
        else { btn.classList.add("p-dim"); }
        btn.innerHTML = `<span style="font-weight:700;opacity:0.6;min-width:22px">${LETTERS[i]}</span><span style="flex:1">${o}</span>${isCorrect ? "<span>✓</span>" : ""}${isMine && !isCorrect ? "<span>✗</span>" : ""}`;
        opts.appendChild(btn);
      });

      let statusHtml = "";
      if (myChoice === q.a) statusHtml = `<div class="status-bar status-correct">✓ Correct!</div>`;
      else if (myChoice !== null) statusHtml = `<div class="status-bar status-wrong">✗ Wrong!</div>`;
      else statusHtml = `<div class="status-bar status-timeout">⏱ Time's up!</div>`;
      document.getElementById("p-status").innerHTML = statusHtml;
      return;
    }

    if (state === "roundEnd") {
      showScreen("screen-player-roundend");
      document.getElementById("pr-score").textContent = `${myScore.toLocaleString()} pts`;
      return;
    }

    if (state === "finished") {
      showScreen("screen-player-finished");
      const s = sorted(scores);
      const pos = s.findIndex(([n]) => n === playerName) + 1;
      document.getElementById("pf-trophy").textContent = pos === 1 ? "🏆" : pos === 2 ? "🥈" : pos === 3 ? "🥉" : "🎮";
      document.getElementById("pf-title").textContent = pos === 1 ? "You WON!" : `You finished ${pos}${pos===2?"nd":pos===3?"rd":"th"}!`;
      document.getElementById("pf-score").textContent = `${myScore.toLocaleString()} pts`;
      const board = document.getElementById("pf-board");
      board.innerHTML = "";
      s.forEach(([n, sc], i) => {
        const row = document.createElement("div");
        row.className = "score-row";
        row.style.background = n === playerName ? "#1e3a5f" : "transparent";
        row.style.borderRadius = "8px";
        row.style.padding = "7px 12px";
        row.innerHTML = `<span class="score-pos" style="color:${i===0?"var(--gold)":"var(--muted)"}">${i+1}</span><span class="score-name" style="color:${n===playerName?"#60a5fa":"var(--text)"}">${n}</span><span class="score-pts">${sc.toLocaleString()}</span>`;
        board.appendChild(row);
      });
      return;
    }
  });
};

// ── MASTER GAME ──────────────────────────────────────────────────────────────
let masterQi = 0;
let masterScores = {};
let masterState = "playing";
let masterPlayers = {};

window.masterStartGame = async function() {
  masterQi = 0;
  masterScores = {};
  await update(roomRef(""), { state: "playing", qIndex: 0, questionStartTime: Date.now(), answers: {}, scores: {} });
  showScreen("screen-master-game");
  masterState = "playing";
  masterRenderQ();
  masterStartTimer();

  // Listen for answers & players
  onValue(roomRef("players"), snap => { masterPlayers = snap.val() || {}; masterUpdateAnswered(); });
  onValue(roomRef("answers"), snap => { masterUpdateAnswered(snap.val()); });
};

function masterStartTimer() {
  clearInterval(timerInterval);
  let t = TIME_LIMIT;
  const el = document.getElementById("m-timer");
  el.textContent = t;
  el.className = "timer-num timer-green";
  timerInterval = setInterval(() => {
    t--;
    el.textContent = t;
    el.className = "timer-num " + (t <= 5 ? "timer-red" : t <= 10 ? "timer-yellow" : "timer-green");
    if (t <= 0) clearInterval(timerInterval);
  }, 1000);
}

function masterRenderQ() {
  const q = QUESTIONS[masterQi];
  const rqs = QUESTIONS.filter(x => x.r === q.r);
  const qir = rqs.indexOf(q) + 1;

  document.getElementById("m-round-badge").textContent = `Round ${q.r}: ${q.rn}`;
  document.getElementById("m-q-num").textContent = `Q${qir}/${rqs.length}`;
  document.getElementById("m-question").textContent = q.q;

  const grid = document.getElementById("m-options");
  grid.innerHTML = "";
  q.o.forEach((o, i) => {
    const d = document.createElement("div");
    d.className = `opt ${OPT_CLASSES[i]}`;
    d.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span><span>${o}</span>`;
    grid.appendChild(d);
  });

  const ctrl = document.getElementById("m-controls");
  ctrl.innerHTML = `<button class="btn btn-purple" onclick="masterReveal()">Reveal Answer</button>`;

  masterRenderScoreboard();
}

function masterUpdateAnswered(answers) {
  const ans = answers || {};
  const pc = Object.keys(masterPlayers).length;
  const ac = Object.values(ans).filter(a => a && a.qIndex === masterQi).length;
  document.getElementById("m-answered").textContent = `${ac}/${pc} answered`;
  document.getElementById("m-progress").style.width = `${pc > 0 ? (ac/pc)*100 : 0}%`;
}

window.masterReveal = async function() {
  clearInterval(timerInterval);
  masterState = "revealing";
  const q = QUESTIONS[masterQi];

  // Get answers
  const snap = await get(roomRef("answers"));
  const answers = snap.val() || {};

  // Score
  Object.entries(answers).forEach(([name, pa]) => {
    if (pa && pa.qIndex === masterQi && pa.choice === q.a) {
      const t = Math.max(0, Math.min(TIME_LIMIT, (pa.timestamp - pa.questionStart) / 1000));
      const bonus = Math.round(PTS_SPEED_MAX * (1 - t / TIME_LIMIT));
      masterScores[name] = (masterScores[name] || 0) + PTS_CORRECT + bonus;
    }
  });

  await update(roomRef(""), { state: "revealing", scores: masterScores });

  // Highlight correct
  const opts = document.querySelectorAll("#m-options .opt");
  opts.forEach((o, i) => {
    if (i === q.a) { o.classList.add("correct"); }
    else { o.classList.add("wrong"); }
  });

  document.getElementById("m-controls").innerHTML = `<button class="btn btn-gold" onclick="masterNext()">${masterQi + 1 >= QUESTIONS.length ? "See Results" : "Next Question"}</button>`;
  masterRenderScoreboard();
};

window.masterNext = async function() {
  const ni = masterQi + 1;
  if (ni >= QUESTIONS.length) {
    await set(roomRef("state"), "finished");
    masterShowFinished();
    return;
  }
  if (QUESTIONS[ni].r !== QUESTIONS[masterQi].r) {
    masterQi = ni;
    masterShowRoundEnd();
    return;
  }
  masterQi = ni;
  await update(roomRef(""), { state: "playing", qIndex: ni, questionStartTime: Date.now(), answers: {} });
  masterState = "playing";
  masterRenderQ();
  masterStartTimer();
};

function masterShowRoundEnd() {
  const prev = QUESTIONS[masterQi - 1];
  const next = QUESTIONS[masterQi];
  document.getElementById("roundend-title").textContent = `Round ${prev.r} Complete!`;
  document.getElementById("roundend-name").textContent = prev.rn;
  document.getElementById("roundend-next").textContent = `Up next: Round ${next.r} - ${next.rn}`;
  document.getElementById("roundend-btn").textContent = `Start Round ${next.r}`;

  const container = document.getElementById("roundend-scores");
  container.innerHTML = "";
  sorted(masterScores).forEach(([n, sc], i) => {
    const row = document.createElement("div");
    row.className = "score-row";
    row.style.background = i === 0 ? "#1e3a5f" : "var(--card)";
    row.style.borderRadius = "10px";
    row.style.marginBottom = "4px";
    row.style.padding = "10px 14px";
    row.innerHTML = `<span class="score-pos" style="color:${i===0?"var(--gold)":"var(--muted)"}">${i===0?"👑":i+1}</span><span class="score-name">${n}</span><span class="score-pts">${sc.toLocaleString()}</span>`;
    container.appendChild(row);
  });

  set(roomRef("state"), "roundEnd");
  showScreen("screen-master-roundend");
}

window.masterNextRound = async function() {
  await update(roomRef(""), { state: "playing", qIndex: masterQi, questionStartTime: Date.now(), answers: {} });
  masterState = "playing";
  showScreen("screen-master-game");
  masterRenderQ();
  masterStartTimer();
};

function masterShowFinished() {
  const container = document.getElementById("final-scores");
  container.innerHTML = "";
  sorted(masterScores).forEach(([n, sc], i) => {
    const row = document.createElement("div");
    row.className = `final-row ${i === 0 ? "final-1" : i === 1 ? "final-2" : i === 2 ? "final-3" : "final-other"}`;
    row.innerHTML = `<span style="font-size:22px;min-width:36px">${["🥇","🥈","🥉"][i] || (i+1)+"."}</span><span style="flex:1;color:#fff;font-weight:600">${n}</span><span style="color:#fff;font-weight:700">${sc.toLocaleString()}</span>`;
    container.appendChild(row);
  });
  showScreen("screen-master-finished");
}

window.masterReset = async function() {
  await remove(roomRef(""));
  location.reload();
};

function masterRenderScoreboard() {
  const sb = document.getElementById("m-scoreboard");
  sb.innerHTML = "";
  const s = sorted(masterScores);
  if (s.length === 0) return;
  s.slice(0, 8).forEach(([n, sc], i) => {
    const row = document.createElement("div");
    row.className = "score-row";
    row.innerHTML = `<span class="score-pos" style="color:${i===0?"var(--gold)":"var(--muted)"}">${i+1}</span><span class="score-name">${n}</span><span class="score-pts">${sc.toLocaleString()}</span>`;
    sb.appendChild(row);
  });
}
</script>
